<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Certificate Project</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #4f5359;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .cert-btn {
            background-color: #3174cb;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-family: Georgia, serif;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background-color 0.3s ease;
        }

        .cert-btn:hover {
            background-color: #255da8;
        }

        /* Modal popup styling */
        .modal {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .modal-content img {
            width: 100%;
            max-height: 85vh;
            object-fit: contain;
            display: block;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #333;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            background: #eee;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .close-btn:hover {
            background: #ddd;
        }
    </style>
</head>
<body>

    <button class="cert-btn" onclick="openCertificate()">Course Certificate</button>

    <div id="certModal" class="modal">
        <div class="modal-content">
            <!-- <span class="close-btn" onclick="closeCertificate()">&times;</span> -->
            <img src="2.png" alt="NPTEL Certificate">
        </div>
    </div>

    <script>
        function openCertificate() {
            document.getElementById('certModal').style.display = 'flex';
        }

        function closeCertificate() {
            document.getElementById('certModal').style.display = 'none';
        }

        window.onclick = function(event) {
            var modal = document.getElementById('certModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>
</html>
